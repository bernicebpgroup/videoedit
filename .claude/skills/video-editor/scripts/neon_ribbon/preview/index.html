<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影片风格预览器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&family=Noto+Sans+SC:wght@500;900&family=Crimson+Text:ital,wght@1,700&family=Montserrat:wght@900&family=Anton&family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm editing-suite inspector, tool first
   IDEA: the phone preview is the monitor; the right column is the inspector panel of an edit app
   PICTURE: the live 9:16 preview of the user's own clip, large, left
   COLOUR and TYPE: neutral paper/graphite UI so the chosen accent is the only colour; Inter + Noto Sans SC
   LAYOUT: monitor left, inspector right; stacks under 860px */
:root{color-scheme:light dark;--bg:light-dark(#f4f3ef,#141412);--panel:light-dark(#ffffff,#1d1d1b);--ink:light-dark(#1b1b19,#efeee9);--mute:light-dark(#6b6a64,#a3a29b);--line:light-dark(#e2e0d8,#33332f);--sel:light-dark(#1b1b19,#efeee9);--selink:light-dark(#ffffff,#141412)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Noto Sans SC",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(16px,3vw,36px) max(4vw,14px);display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:clamp(18px,3vw,40px);align-items:start}
h1{font-size:clamp(24px,3vw,32px);line-height:1.1;margin:0 0 6px;font-weight:800;text-wrap:balance}
.lede{color:var(--mute);margin:0 0 18px;font-size:14px}
.mon{position:sticky;top:16px}
.screen{position:relative;aspect-ratio:9/16;width:100%;max-height:calc(100vh - 140px);margin:0 auto;border-radius:22px;overflow:hidden;background:#111;box-shadow:0 0 0 1px var(--line)}
.screen canvas{position:absolute;inset:0;width:100%;height:100%}
.transport{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.seek{flex:1 1 120px;accent-color:var(--ink)}
button,.chip{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:40px;padding:6px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button[aria-pressed=true]{background:var(--sel);color:var(--selink);border-color:var(--sel)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px 18px}
.sec{padding:16px 0;border-bottom:1px solid var(--line)}.sec:last-child{border-bottom:0}
.sec h2{font-size:14px;font-weight:600;margin:0 0 10px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.font b{display:block;font-size:24px;line-height:1.15;font-weight:400}
.font small{display:block;font-size:12px;opacity:.75}
.font{text-align:left;padding:8px 12px}
.sw{width:40px;height:40px;border-radius:50%;padding:0;border:2px solid var(--line)}
.sw[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:2px;background:inherit}
input[type=text]{font:inherit;font-size:16px;width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg);color:var(--ink)}
input[type=color]{width:44px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:3px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
label.f{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}
.out{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px dashed var(--line);font-size:14px;word-break:break-all}
.go{background:var(--sel);color:var(--selink);border-color:var(--sel);font-weight:600;width:100%;min-height:48px}
.styl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media(max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.mon{position:static}.screen{max-width:380px;max-height:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mon">
    <h1>影片风格预览器</h1>
    <p class="lede">点右边的选项，影片上的效果马上换。片段是你上传的口播视频前 11 秒。</p>
    <div class="screen"><canvas id="out" width="540" height="960" aria-label="影片预览"></canvas></div>
    <div class="transport">
      <button id="play" aria-label="播放或暂停">暂停</button>
      <input id="seek" class="seek" type="range" min="0" max="1133" step="1" value="0" aria-label="时间">
      <button id="snd" aria-pressed="false">声音</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="chip" data-jump="0.6">关键词</button>
      <button class="chip" data-jump="2.8">卡片</button>
      <button class="chip" data-jump="5.6">圆形</button>
      <button class="chip" data-jump="8.9">音频条</button>
    </div>
  </div>

  <div class="panel">
    <div class="sec">
      <h2>风格</h2>
      <div class="styl"><button aria-pressed="true">I 霓虹飘带</button><span class="note" style="margin:0">A–H 的预览之后会一个个加进来</span></div>
    </div>
    <div class="sec">
      <h2>关键词字体</h2>
      <div class="row" id="fonts"></div>
    </div>
    <div class="sec">
      <h2>重点颜色</h2>
      <div class="row" id="colors" style="align-items:center"></div>
    </div>
    <div class="sec">
      <h2>效果</h2>
      <div class="row">
        <button id="glow" aria-pressed="false">大字发光</button>
        <button id="stroke" aria-pressed="false">大字黑边</button>
        <button id="subs" aria-pressed="false">底部完整字幕</button>
      </div>
    </div>
    <div class="sec">
      <h2>画面上的字（可以直接改）</h2>
      <div class="grid2">
        <div><label class="f" for="t-big">关键词大字</label><input type="text" id="t-big" data-k="big"></div>
        <div><label class="f" for="t-small">引导小字</label><input type="text" id="t-small" data-k="small"></div>
        <div><label class="f" for="t-pill">标签</label><input type="text" id="t-pill" data-k="pill"></div>
        <div><label class="f" for="t-ring">圆形外圈字</label><input type="text" id="t-ring" data-k="ring"></div>
        <div><label class="f" for="t-c0">卡片 1</label><input type="text" id="t-c0" data-k="c0"></div>
        <div><label class="f" for="t-c1">卡片 2</label><input type="text" id="t-c1" data-k="c1"></div>
        <div><label class="f" for="t-c2">卡片 3</label><input type="text" id="t-c2" data-k="c2"></div>
        <div><label class="f" for="t-sub">底部字幕</label><input type="text" id="t-sub" data-k="sub"></div>
      </div>
    </div>
    <div class="sec">
      <button class="go" id="done">就用这个，复制设定</button>
      <div class="out" id="out-line" role="status"></div>
      <p class="note">把复制的设定贴回 chat，我就照这个出完整 mp4。预览是浏览器即时画的近似效果，成片的飘带遮挡、字边更精细。</p>
    </div>
  </div>
</div>

<video id="vid" src="clip.mp4" muted loop playsinline autoplay crossorigin="anonymous" style="display:none"></video>

<script>
{
const W = 540, H = 960;
const FONTS = [
  {k:'serif_black', name:'粗宋体', css:'900 24px "Noto Serif SC"', sample:'拍卖赢家'},
  {k:'serif_italic', name:'衬线斜体', css:'italic 700 26px "Crimson Text"', sample:'editors'},
  {k:'sans_black', name:'粗黑体', css:'900 24px "Noto Sans SC"', sample:'拍卖赢家'},
  {k:'montserrat', name:'Montserrat', css:'900 22px Montserrat', sample:'RM 380K'},
  {k:'anton', name:'Anton', css:'400 26px Anton', sample:'AUCTION'}
];
const COLORS = [['#D4F23A','荧光黄绿'],['#3B82F6','蓝色'],['#312F92','品牌深蓝'],['#C9A227','金色'],['#FF6B4A','珊瑚橘']];
const def = {font:'serif_italic', accent:'#D4F23A', glow:false, stroke:false, subs:false,
  big:'Where', small:'to find', pill:'where to find', ring:'WHERE TO FIND • ', c0:'Location', c1:'Property', c2:'Search', sub:'这里会显示你说的每一句话'};
let st = {...def};
try { const s = JSON.parse(localStorage.getItem('pv-style-i') || 'null'); if (s) st = {...def, ...s}; } catch (e) {}
const save = () => { try { localStorage.setItem('pv-style-i', JSON.stringify(st)); } catch (e) {} };

const vid = document.getElementById('vid');
const out = document.getElementById('out'), octx = out.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const S = mk(), sctx = S.getContext('2d');
const P = mk(), pctx = P.getContext('2d', {willReadFrequently:true});
const M = mk(), mctx = M.getContext('2d', {willReadFrequently:true});
const BG = mk(), bgctx = BG.getContext('2d');
const RB = mk(), rbctx = RB.getContext('2d'), RF = mk(), rfctx = RF.getContext('2d');
let data = {face:[[216,341]], rms:[0.3]}, noMask = false;
fetch('data.json').then(r => r.json()).then(d => { data = d; }).catch(() => {});

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = x => 1 - (1 - clamp(x)) ** 3;
const easeIO = x => { x = clamp(x); return 3 * x * x - 2 * x * x * x; };
const backOut = (x, s = 1.9) => { x = clamp(x) - 1; return x * x * ((s + 1) * x + s) + 1; };
function pop(t, t0, t1, dur = 0.28, o = 0.22) {
  if (t < t0 || t > t1) return [0, 0];
  const a = clamp((t - t0) / 0.12) * clamp((t1 - t) / o);
  return [backOut((t - t0) / dur) * (0.85 + 0.15 * clamp((t1 - t) / o)), a];
}
const hex = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const rgb = (c, a = 1) => `rgba(${c.map(v => Math.round(v)).join(',')},${a})`;
const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const isCJK = s => /[　-鿿＀-￯]/.test(s);
function acc() { const c = hex(st.accent); return {c, d: c.map(v => v * 0.7), l: mix(c, [255, 255, 255], 0.55), lum: 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]}; }

function faceAt(t) {
  const f = data.face, i = clamp(Math.floor(t * 2), 0, f.length - 1);
  let x = 0, y = 0, n = 0;
  for (let j = Math.max(0, i - 2); j < Math.min(f.length, i + 3); j++) { x += f[j][0]; y += f[j][1]; n++; }
  return [x / n, y / n];
}
const ZOOMS = [[0, 1], [2.6, 1.12], [5.6, 1], [8.8, 1.1]];
function zoomAt(t) { let z = 1; ZOOMS.forEach(([t0, zz], i) => { if (t >= t0) { const p = i ? ZOOMS[i - 1][1] : zz; z = p + (zz - p) * easeOut((t - t0) / 0.18); } }); return z; }

function ribbon(t, cx, cy, prog, tail, p) {
  rbctx.clearRect(0, 0, W, H); rfctx.clearRect(0, 0, W, H);
  if (prog - tail < 0.01) return;
  const A = acc(), N = 150, R = p.R || 215, top = cy + (p.top || -450), len = p.len || 1200, turns = p.turns || 1.35, wd = 48, ph = p.phase || 0;
  const pts = [], zs = [], ks = [], ws = [];
  for (let i = 0; i < N; i++) {
    const u = tail + (prog - tail) * i / (N - 1);
    const phi = ph + u * turns * 2 * Math.PI + t * 0.55;
    pts.push([cx + R * Math.cos(phi) * (0.85 + 0.15 * Math.sin(u * 3)), top + u * len + 60 * Math.sin(phi)]);
    const z = Math.sin(phi), k = Math.cos(u * 9 + t * 1.3 + ph);
    const ends = clamp((u - tail) / 0.06) * clamp((prog - u) / 0.06);
    zs.push(z); ks.push(k); ws.push(wd * (0.28 + 0.72 * Math.abs(k)) * (1 + 0.18 * z) * (0.25 + 0.75 * ends));
  }
  const L = [], Rr = [];
  for (let i = 0; i < N; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(N - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const n = Math.hypot(tx, ty) || 1; tx /= n; ty /= n;
    L.push([pts[i][0] - ty * ws[i] / 2, pts[i][1] + tx * ws[i] / 2]); Rr.push([pts[i][0] + ty * ws[i] / 2, pts[i][1] - tx * ws[i] / 2]);
  }
  for (let i = 0; i < N - 1; i++) {
    const light = 0.5 + 0.5 * ks[i], face = ks[i] >= 0;
    const base = face ? A.c : A.l, hi = face ? A.l : [250, 252, 240];
    let c = mix(A.d, base, Math.min(1, light * 1.4)); c = mix(c, hi, Math.max(0, light - 0.75) * 3);
    const g = zs[i] > 0 ? rfctx : rbctx;
    const e = (P, Q) => [Q[0] + (Q[0] - P[0]) * 0.3, Q[1] + (Q[1] - P[1]) * 0.3];
    const l1 = e(L[i], L[i + 1]), r1 = e(Rr[i], Rr[i + 1]);
    g.fillStyle = rgb(c); g.beginPath(); g.moveTo(L[i][0], L[i][1]); g.lineTo(l1[0], l1[1]); g.lineTo(r1[0], r1[1]); g.lineTo(Rr[i][0], Rr[i][1]); g.closePath(); g.fill();
  }
}

function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function kwFont(txt, size) {
  const cjk = isCJK(txt);
  switch (st.font) {
    case 'serif_black': return [`900 ${size}px "Noto Serif SC"`, 0];
    case 'serif_italic': return cjk ? [`900 ${size * 0.9}px "Noto Serif SC"`, -0.22] : [`italic 700 ${size}px "Crimson Text"`, 0];
    case 'sans_black': return [`900 ${size}px "Noto Sans SC"`, 0];
    case 'montserrat': return cjk ? [`900 ${size * 0.9}px "Noto Sans SC"`, 0] : [`900 ${size * 0.8}px Montserrat`, 0];
    default: return cjk ? [`900 ${size * 0.9}px "Noto Sans SC"`, 0] : [`400 ${size}px Anton`, 0];
  }
}
function within(g, x, y, s, a, rot, fn) {
  if (a <= 0.003 || s <= 0.01) return;
  g.save(); g.globalAlpha = a; g.translate(x, y); g.rotate(rot * Math.PI / 180); g.scale(s, s); fn(g); g.restore();
}
function keyword(g, t) {
  const t0 = 0.6, t1 = 2.5, y = 615; if (t < t0 || t > t1) return;
  const A = acc(); let [f, sk] = kwFont(st.big || ' ', 125);
  g.font = f; let tw = g.measureText(st.big).width; let fit = Math.min(1, 430 / Math.max(tw, 1));
  const sw = Math.min(500, tw * fit + 80), sh = 130;
  let [s, a] = pop(t, t0, t1, 0.3);
  within(g, 270, y, s, a * 0.97, -2, g => {
    g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 18; g.shadowOffsetY = 8;
    rr(g, -sw / 2, -sh / 2, sw, sh, 9); g.fillStyle = 'rgba(22,24,20,.94)'; g.fill(); g.shadowColor = 'transparent';
    g.save(); rr(g, -sw / 2 + 6, -sh / 2 + 29, sw - 12, sh - 58, 4); g.clip(); g.drawImage(BG, 0, 150, W, 300, -sw / 2, -sh / 2 + 29, sw, sh - 58); g.restore();
    g.fillStyle = '#ebebe1';
    for (let x = -sw / 2 + 7; x < sw / 2 - 18; x += 20) { rr(g, x, -sh / 2 + 5, 11, 7, 2); g.fill(); rr(g, x, sh / 2 - 12, 11, 7, 2); g.fill(); }
  });
  [s, a] = pop(t, t0 + 0.08, t1, 0.3);
  within(g, 270, y + 4, s * fit, a, -2, g => {
    g.font = f; g.textAlign = 'center'; g.textBaseline = 'middle';
    if (sk) g.transform(1, 0, sk, 1, 0, 0);
    if (st.glow) { g.shadowColor = rgb(A.c, 0.95); g.shadowBlur = 26; }
    else { g.shadowColor = 'rgba(0,0,0,.4)'; g.shadowBlur = 10; g.shadowOffsetY = 5; }
    if (st.stroke) { g.lineWidth = 5; g.strokeStyle = '#2a2f12'; g.lineJoin = 'round'; g.strokeText(st.big, 0, 0); }
    g.fillStyle = rgb(A.c); g.fillText(st.big, 0, 0);
    if (st.glow) g.fillText(st.big, 0, 0);
  });
  if (st.small) {
    [s, a] = pop(t, t0 + 0.25, t1);
    g.font = isCJK(st.small) ? '500 29px "Noto Sans SC"' : '800 29px Inter';
    const w2 = g.measureText(st.small).width;
    within(g, 270 + sw / 2 - w2 / 2 - 10, y + sh / 2 + 22, s, a, 0, g => {
      g.font = isCJK(st.small) ? '500 29px "Noto Sans SC"' : '800 29px Inter';
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 8; g.shadowOffsetY = 3;
      g.fillStyle = '#fff'; g.fillText(st.small, 0, 0);
    });
  }
}
function icon(g, kind, s, col) {
  g.save(); g.strokeStyle = col; g.fillStyle = col; g.lineWidth = s / 12; g.lineCap = 'round'; g.lineJoin = 'round';
  const c = (x, y) => [x * s - s / 2, y * s - s / 2];
  g.beginPath();
  if (kind === 'pin') { g.arc(...c(.5, .38), s * .26, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.moveTo(...c(.29, .52)); g.lineTo(...c(.5, .92)); g.lineTo(...c(.71, .52)); g.fill(); g.beginPath(); g.arc(...c(.5, .38), s * .09, 0, Math.PI * 2); g.fill(); }
  else if (kind === 'house') { g.moveTo(...c(.5, .12)); g.lineTo(...c(.9, .48)); g.lineTo(...c(.8, .48)); g.lineTo(...c(.8, .88)); g.lineTo(...c(.58, .88)); g.lineTo(...c(.58, .64)); g.lineTo(...c(.42, .64)); g.lineTo(...c(.42, .88)); g.lineTo(...c(.2, .88)); g.lineTo(...c(.2, .48)); g.lineTo(...c(.1, .48)); g.closePath(); g.fill(); }
  else if (kind === 'search') { g.arc(...c(.42, .42), s * .26, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.lineWidth = s / 8; g.moveTo(...c(.62, .62)); g.lineTo(...c(.86, .86)); g.stroke(); }
  else if (kind === 'gavel') { g.save(); g.translate(...c(.42, .34)); g.rotate(-0.7); g.fillRect(-s * .22, -s * .1, s * .44, s * .2); g.restore(); g.moveTo(...c(.45, .4)); g.lineTo(...c(.82, .8)); g.stroke(); g.fillRect(...c(.14, .84), s * .46, s * .08); }
  else if (kind === 'doc') { g.roundRect(...c(.24, .1), s * .52, s * .8, s * .06); g.stroke(); [.34, .5, .66].forEach(y => { g.beginPath(); g.moveTo(...c(.36, y)); g.lineTo(...c(.64, y)); g.stroke(); }); }
  else { g.arc(0, 0, s * .38, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.ellipse(0, 0, s * .16, s * .38, 0, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.moveTo(-s * .38, 0); g.lineTo(s * .38, 0); g.stroke(); }
  g.restore();
}
function card(g, kind, label, w, h) {
  const A = acc();
  g.shadowColor = 'rgba(0,0,0,.28)'; g.shadowBlur = 18; g.shadowOffsetY = 8;
  rr(g, -w / 2, -h / 2, w, h, 17); g.fillStyle = 'rgba(255,255,255,.98)'; g.fill(); g.shadowColor = 'transparent';
  g.beginPath(); g.arc(0, -h / 2 + 50, 33, 0, Math.PI * 2); g.fillStyle = rgb(A.c); g.fill();
  g.save(); g.translate(0, -h / 2 + 50); icon(g, kind, 38, A.lum > 150 ? '#181a16' : '#ffffff'); g.restore();
  g.font = isCJK(label) ? '500 15px "Noto Sans SC"' : '800 15px Inter'; g.fillStyle = '#181a16'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(label, 0, h / 2 - 28, w - 12);
}
function pill(g, txt, x, y, s, a) {
  within(g, x, y, s, a, 0, g => {
    g.font = isCJK(txt) ? '500 18px "Noto Sans SC"' : '600 18px Inter';
    const tw = g.measureText(txt).width, w = tw + 62, h = 42;
    g.shadowColor = 'rgba(0,0,0,.22)'; g.shadowBlur = 12; g.shadowOffsetY = 5;
    rr(g, -w / 2, -h / 2, w, h, h / 2); g.fillStyle = '#fff'; g.fill(); g.shadowColor = 'transparent';
    g.beginPath(); g.arc(-w / 2 + 23, 0, 8, 0, Math.PI * 2); g.fillStyle = rgb(acc().c); g.fill();
    g.fillStyle = '#181a16'; g.textBaseline = 'middle'; g.textAlign = 'left'; g.fillText(txt, -w / 2 + 40, 1);
  });
}
function cardsRow(g, t) {
  const t0 = 2.8, t1 = 5.4, kinds = ['pin', 'house', 'search'];
  kinds.forEach((k, j) => {
    const [s, a] = pop(t, t0 + j * 0.14, t1);

}
function bars(g, t, fi) {
  const t0 = 8.9, t1 = 11.3; if (t < t0 || t > t1) return;
  const [s, a] = pop(t, t0, t1), A = acc(), nb = 26, bw = 11, gap = 6, by = 780, x0 = 270 - nb * (bw + gap) / 2;
  g.save(); g.globalAlpha = a * 0.85; rr(g, x0 - 15, by - 47, nb * (bw + gap) + 24, 94, 18); g.fillStyle = '#161814'; g.fill();
  g.globalAlpha = a; g.fillStyle = rgb(A.c);

    const r = data.rms[clamp(fi - Math.abs(j - 13), 0, data.rms.length - 1)] || 0.2;
    const hh = (7 + 60 * r * (0.6 + 0.4 * Math.sin(j * 1.7 + t * 9) ** 2)) * s;

function subtitle(g) {

  g.save(); g.font = '900 27px "Noto Sans SC"'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(0,0,0,.75)'; g.shadowBlur = 10; g.shadowOffsetY = 3; g.fillStyle = '#fff';
  g.fillText(st.sub, 270, 850, 480); g.restore();
}
function circleMode(t, fx, fy) {
  const t0 = 5.6, t1 = 8.8; if (t < t0 || t > t1) return false;
  const A = acc(), k = Math.min(easeIO((t - t0) / 0.45), easeIO((t1 - t) / 0.4));
  const ccx = 270, ccy = 360, rad = 700 + (165 - 700) * k;
  octx.fillStyle = '#eef0e6'; octx.fillRect(0, 0, W, H);
  if (k > 0.3) {
    const ka = clamp((k - 0.3) / 0.7), prog = easeOut((t - t0 - 0.3) / (t1 - t0 - 0.6));
    octx.save(); octx.globalAlpha = ka; octx.strokeStyle = rgb(A.d);

    octx.lineWidth = 1; octx.globalAlpha = ka * 0.25; octx.beginPath(); octx.arc(ccx, ccy, rad + 59, 0, Math.PI * 2); octx.stroke();

    const txt = (st.ring || ' ').repeat(Math.max(1, Math.round(60 / Math.max(4, (st.ring || ' ').length))));
    octx.font = isCJK(txt) ? '900 19px "Noto Sans SC"' : '800 19px Inter'; octx.fillStyle = rgb(A.d); octx.textAlign = 'center'; octx.textBaseline = 'middle';
    const chars = [...txt], r2 = rad + 35, rot = -(t - t0) * 0.38;

  octx.drawImage(S, (ccx - fx) * k, (ccy - fy) * k); octx.restore();
  let [s, a] = pop(t, t0 + 0.55, t1 - 0.15); pill(octx, st.pill, ccx, 640, s, a);
  ['gavel', 'doc', 'web'].forEach((kd, j) => {
    const [s2, a2] = pop(t, t0 + 0.8 + j * 0.15, t1 - 0.1);
    const lab = ['Auction', 'Listing', 'Online'][j];

}

function frame() {
  const t = vid.currentTime || 0, fi = Math.min(data.rms.length - 1, Math.floor(t * 30));
  const [fx, fy] = faceAt(t), z = zoomAt(t);
  if (vid.readyState >= 2) {
    bgctx.setTransform(z, 0, 0, z, fx * (1 - z), fy * (1 - z));
    bgctx.filter = noMask ? 'none' : 'blur(9px)';
    bgctx.drawImage(vid, 0, 0, 540, 960, -14, -14, W + 28, H + 28); bgctx.filter = 'none'; bgctx.setTransform(1, 0, 0, 1, 0, 0);
    if (!noMask) {
      try {
        pctx.drawImage(vid, 0, 0, 540, 960, 0, 0, W, H); mctx.drawImage(vid, 540, 0, 540, 960, 0, 0, W, H);
        const pd = pctx.getImageData(0, 0, W, H), md = mctx.getImageData(0, 0, W, H).data, d = pd.data;
        for (let i = 3; i < d.length; i += 4) d[i] = md[i - 3];
        pctx.putImageData(pd, 0, 0);

  sctx.clearRect(0, 0, W, H); sctx.drawImage(BG, 0, 0);

  if (t <= 6.0) rp = [0, 5.4, {in: 1.1}]; else if (t >= 8.8) rp = [8.8, 11.3, {in: 0.9, phase: 2, turns: 1.1}];
  if (rp) { const prog = easeOut((t - rp[0]) / rp[2].in), tail = t > rp[1] ? easeIO((t - rp[1]) / 0.6) * prog : 0; ribbon(t, fx, fy, prog, tail, rp[2]); }
  else { rbctx.clearRect(0, 0, W, H); rfctx.clearRect(0, 0, W, H); }
  if (!noMask) { sctx.drawImage(RB, 0, 0); sctx.save(); sctx.setTransform(z, 0, 0, z, fx * (1 - z), fy * (1 - z)); sctx.drawImage(P, 0, 0); sctx.restore(); }
  else sctx.drawImage(RB, 0, 0);
  sctx.save(); sctx.shadowColor = 'rgba(0,0,0,.3)'; sctx.shadowBlur = 16; sctx.shadowOffsetY = 10; sctx.drawImage(RF, 0, 0); sctx.restore();
  if (!circleMode(t, fx, fy)) {
    keyword(sctx, t); cardsRow(sctx, t); bars(sctx, t, fi); subtitle(sctx);
    octx.drawImage(S, 0, 0);
  } else subtitle(octx);
  seek.value = Math.round(t * 100);
  requestAnimationFrame(frame);
}

const seek = document.getElementById('seek'), play = document.getElementById('play'), snd = document.getElementById('snd');
play.onclick = () => { if (vid.paused) { vid.play().catch(() => {}); play.textContent = '暂停'; } else { vid.pause(); play.textContent = '播放'; } };
seek.oninput = () => { vid.currentTime = seek.value / 100; };
snd.onclick = () => { vid.muted = !vid.muted; snd.setAttribute('aria-pressed', String(!vid.muted)); if (!vid.muted) vid.play().catch(() => {}); };
document.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => { vid.currentTime = +b.dataset.jump; });

const fontsEl = document.getElementById('fonts');
fontsEl.innerHTML = FONTS.map(f => `<button class="font" data-font="${f.k}" aria-pressed="false"><b style='font:${f.css}'>${f.sample}</b><small>${f.name}</small></button>`).join('');
const colorsEl = document.getElementById('colors');
colorsEl.innerHTML = COLORS.map(([c, n]) => `<button class="sw" data-color="${c}" style="background:${c}" aria-label="${n}" title="${n}" aria-pressed="false"></button>`).join('') + `<input type="color" id="custom" aria-label="自选颜色">`;
function sync() {
  fontsEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.font === st.font)));
  colorsEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.color.toLowerCase() === st.accent.toLowerCase())));
  document.getElementById('custom').value = st.accent;
  ['glow', 'stroke', 'subs'].forEach(k => document.getElementById(k).setAttribute('aria-pressed', String(st[k])));

  save();
}
fontsEl.onclick = e => { const b = e.target.closest('[data-font]'); if (b) { st.font = b.dataset.font; sync(); } };
colorsEl.onclick = e => { const b = e.target.closest('[data-color]'); if (b) { st.accent = b.dataset.color; sync(); } };
document.getElementById('custom').oninput = e => { st.accent = e.target.value; sync(); };
['glow', 'stroke', 'subs'].forEach(k => document.getElementById(k).onclick = () => { st[k] = !st[k]; sync(); });
document.querySelectorAll('input[data-k]').forEach(i => i.oninput = () => { st[i.dataset.k] = i.value; save(); });

sync();
document.fonts.ready.then(() => {});
FONTS.forEach(f => document.fonts.load(f.css.replace(/\d+px/, '60px'), f.sample).catch(() => {}));
['900 30px "Noto Sans SC"', '500 20px "Noto Sans SC"', '800 20px Inter', '600 20px Inter', '900 30px "Noto Serif SC"'].forEach(f => document.fonts.load(f, '拍卖Ab').catch(() => {}));
vid.play().catch(() => { play.textContent = '播放'; });
requestAnimationFrame(frame);
}
